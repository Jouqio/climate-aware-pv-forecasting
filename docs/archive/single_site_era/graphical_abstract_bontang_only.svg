<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 680 520" role="img">
<title>Graphical Abstract: Deterministic Target Leakage in Photovoltaic Forecasting</title>
<desc>Four-panel research summary showing the research flow: (1) The leakage problem R2=0.9999, (2) Stochastic correction R2=0.226, (3) Walk-forward forecastability results, (4) ENSO and SHAP findings.</desc>

<!-- Styles for standalone SVG -->
<defs>
  <style>
    text { font-family: "Times New Roman", serif; }
    .th { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .ts { font-size: 12px; font-weight: 400; fill: #444; }
    .h-txt { font-size: 13px; font-weight: 700; fill: #fff; }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="680" height="520" fill="#fafafa"/>

<!-- Title banner -->
<rect x="20" y="12" width="640" height="44" rx="8" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
<text class="h-txt" x="340" y="34" text-anchor="middle" dominant-baseline="central" font-size="13">Deterministic Leakage Correction in PV Forecasting</text>
<text class="h-txt" x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" opacity="0.9">Bontang, Kalimantan Timur | NASA POWER 2005–2025 | n=252 monthly observations</text>

<!-- Panel 1: The Problem -->
<rect x="20" y="72" width="140" height="26" rx="6" fill="#A32D2D" stroke="#791F1F" stroke-width="0.5"/>
<text class="h-txt" x="90" y="85" text-anchor="middle" dominant-baseline="central" font-size="12">① The Problem</text>
<rect x="20" y="104" width="300" height="160" rx="8" fill="#FFF5F5" stroke="#F09595" stroke-width="0.7"/>
<rect x="36" y="118" width="88" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="80" y="132" text-anchor="middle" dominant-baseline="central">GHI, T₂ₘ</text>
<text class="ts" x="80" y="145" text-anchor="middle" dominant-baseline="central">(predictors)</text>
<line x1="128" y1="135" x2="155" y2="135" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="157" y="118" width="90" height="34" rx="6" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
<text class="ts" x="202" y="128" text-anchor="middle" dominant-baseline="central">Y_det = f(GHI,T)</text>
<text class="ts" x="202" y="142" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">algebraic</text>
<line x1="249" y1="135" x2="272" y2="135" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="274" y="118" width="36" height="34" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
<text class="ts" x="292" y="135" text-anchor="middle" dominant-baseline="central">R²</text>
<text x="292" y="168" text-anchor="middle" fill="#E24B4A" font-size="20" font-weight="700" font-family="Times New Roman,serif">0.9999</text>
<text class="ts" x="170" y="198" text-anchor="middle">Any model trivially recovers this</text>
<text class="ts" x="170" y="212" text-anchor="middle">identity — not genuine forecasting</text>
<text x="170" y="247" text-anchor="middle" fill="#A32D2D" font-size="13" font-weight="700" font-family="Times New Roman,serif">4.4× R² overstatement</text>

<!-- Fix arrow -->
<line x1="322" y1="184" x2="338" y2="184" stroke="#0F6E56" stroke-width="2" marker-end="url(#arr)"/>
<text font-family="Times New Roman,serif" x="330" y="174" text-anchor="middle" fill="#0F6E56" font-size="11" font-weight="700">Fix</text>

<!-- Panel 2: The Correction -->
<rect x="340" y="72" width="140" height="26" rx="6" fill="#085041" stroke="#04342C" stroke-width="0.5"/>
<text class="h-txt" x="410" y="85" text-anchor="middle" dominant-baseline="central" font-size="12">② The Correction</text>
<rect x="340" y="104" width="300" height="160" rx="8" fill="#F5FEFA" stroke="#9FE1CB" stroke-width="0.7"/>
<!-- 7 loss pills -->
<rect x="354" y="116" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="390" y="126" text-anchor="middle" dominant-baseline="central">L_thermal</text>
<rect x="434" y="116" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="470" y="126" text-anchor="middle" dominant-baseline="central">L_cloud</text>
<rect x="514" y="116" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="550" y="126" text-anchor="middle" dominant-baseline="central">L_aerosol</text>
<rect x="354" y="142" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="390" y="152" text-anchor="middle" dominant-baseline="central">L_humidity</text>
<rect x="434" y="142" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="470" y="152" text-anchor="middle" dominant-baseline="central">L_inverter</text>
<rect x="514" y="142" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="550" y="152" text-anchor="middle" dominant-baseline="central">L_monsoon</text>
<rect x="394" y="168" width="72" height="20" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="430" y="178" text-anchor="middle" dominant-baseline="central">L_ENSO</text>
<line x1="430" y1="198" x2="430" y2="216" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<!-- Result -->
<rect x="366" y="218" width="128" height="34" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.7"/>
<text class="ts" x="430" y="229" text-anchor="middle" dominant-baseline="central">Y_stoch (genuine)</text>
<text x="430" y="246" text-anchor="middle" fill="#3B6D11" font-size="15" font-weight="700" font-family="Times New Roman,serif">R² = 0.226</text>
<!-- Sensitivity badge -->
<rect x="514" y="218" width="116" height="36" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.7"/>
<text class="ts" x="572" y="229" text-anchor="middle" dominant-baseline="central" fill="#633806">Leakage ratio:</text>
<text x="572" y="246" text-anchor="middle" fill="#633806" font-size="13" font-weight="700" font-family="Times New Roman,serif">3.5× (CV=18%)</text>

<!-- Panel 3: Walk-forward -->
<rect x="20" y="282" width="200" height="26" rx="6" fill="#3C3489" stroke="#26215C" stroke-width="0.5"/>
<text class="h-txt" x="120" y="295" text-anchor="middle" dominant-baseline="central" font-size="11">③ Forecastability (9-fold WF)</text>
<rect x="20" y="314" width="300" height="190" rx="8" fill="#FAFAFE" stroke="#AFA9EC" stroke-width="0.7"/>
<text class="ts" x="34" y="332">XGBoost Skill Score per fold vs per-fold climatology</text>
<!-- zero line -->
<line x1="36" y1="450" x2="300" y2="450" stroke="#888" stroke-width="0.5"/>
<!-- positive bars -->
<rect x="40"  y="365" width="24" height="85" rx="3" fill="#7F77DD" opacity="0.8"/>
<rect x="70"  y="413" width="24" height="37" rx="3" fill="#7F77DD" opacity="0.8"/>
<rect x="100" y="426" width="24" height="24" rx="3" fill="#7F77DD" opacity="0.8"/>
<rect x="130" y="430" width="24" height="20" rx="3" fill="#7F77DD" opacity="0.8"/>
<rect x="160" y="354" width="24" height="96" rx="3" fill="#534AB7" opacity="0.95"/>
<rect x="190" y="388" width="24" height="62" rx="3" fill="#7F77DD" opacity="0.8"/>
<rect x="220" y="400" width="24" height="50" rx="3" fill="#7F77DD" opacity="0.8"/>
<!-- negative bars -->
<rect x="250" y="450" width="24" height="30" rx="3" fill="#E24B4A" opacity="0.7"/>
<rect x="280" y="450" width="24" height="25" rx="3" fill="#E24B4A" opacity="0.7"/>
<!-- peak labels -->
<text font-family="Times New Roman,serif" x="52"  y="359" text-anchor="middle" fill="#3C3489" font-size="10" font-weight="700">+0.34</text>
<text font-family="Times New Roman,serif" x="172" y="348" text-anchor="middle" fill="#3C3489" font-size="10" font-weight="700">+0.37</text>
<!-- year labels -->
<text class="ts" x="52"  y="468" text-anchor="middle" font-size="10">15</text>
<text class="ts" x="82"  y="468" text-anchor="middle" font-size="10">16</text>
<text class="ts" x="112" y="468" text-anchor="middle" font-size="10">17</text>
<text class="ts" x="142" y="468" text-anchor="middle" font-size="10">18</text>
<text class="ts" x="172" y="468" text-anchor="middle" font-size="10">19</text>
<text class="ts" x="202" y="468" text-anchor="middle" font-size="10">20</text>
<text class="ts" x="232" y="468" text-anchor="middle" font-size="10">21</text>
<text class="ts" x="262" y="468" text-anchor="middle" font-size="10" fill="#A32D2D">22</text>
<text class="ts" x="292" y="468" text-anchor="middle" font-size="10" fill="#A32D2D">23</text>
<text class="ts" x="168" y="486" text-anchor="middle">Mean SS = +0.085 (7/9 positive)</text>
<text class="ts" x="168" y="500" text-anchor="middle">DM p = 0.960 → OLS ≡ XGBoost</text>

<!-- Panel 4: ENSO + SHAP -->
<rect x="340" y="282" width="200" height="26" rx="6" fill="#854F0B" stroke="#633806" stroke-width="0.5"/>
<text class="h-txt" x="440" y="295" text-anchor="middle" dominant-baseline="central" font-size="11">④ ENSO + Explainability</text>
<rect x="340" y="314" width="300" height="190" rx="8" fill="#FEFAF5" stroke="#FAC775" stroke-width="0.7"/>
<text class="ts" x="354" y="332">SARIMAX RMSE by ENSO phase</text>
<!-- ENSO bars -->
<rect x="360" y="368" width="70" height="62" rx="4" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.7"/>
<text class="ts" x="395" y="390" text-anchor="middle" dominant-baseline="central">El Niño</text>
<text x="395" y="413" text-anchor="middle" fill="#A32D2D" font-size="13" font-weight="700" font-family="Times New Roman,serif">0.083</text>
<rect x="450" y="381" width="70" height="49" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.7"/>
<text class="ts" x="485" y="400" text-anchor="middle" dominant-baseline="central">Neutral</text>
<text x="485" y="420" text-anchor="middle" fill="#5F5E5A" font-size="13" font-weight="700" font-family="Times New Roman,serif">0.072</text>
<rect x="540" y="385" width="70" height="45" rx="4" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.7"/>
<text class="ts" x="575" y="403" text-anchor="middle" dominant-baseline="central">La Niña</text>
<text x="575" y="420" text-anchor="middle" fill="#185FA5" font-size="13" font-weight="700" font-family="Times New Roman,serif">0.071</text>
<text x="490" y="442" text-anchor="middle" fill="#BA7517" font-size="11" font-weight="700" font-family="Times New Roman,serif">+14.8% El Niño premium</text>
<text class="ts" x="490" y="456" text-anchor="middle">(directional; KW p = 0.668, ns)</text>
<!-- Divider -->
<line x1="354" y1="464" x2="626" y2="464" stroke="#E5E0D0" stroke-width="0.5"/>
<!-- SHAP + PI -->
<text class="ts" x="490" y="478" text-anchor="middle">SHAP top: GHI_anom (all fold sizes)</text>
<text class="ts" x="490" y="492" text-anchor="middle">OLS GHI_anom: β=+0.088, p&lt;0.001</text>
<text class="ts" x="490" y="506" text-anchor="middle">SARIMAX PICP=0.935, Winkler=0.386</text>

</svg>
